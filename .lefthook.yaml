pre-commit:
  parallel: true
  commands:
    go-lint:
      run: |
        pkgs=$(go list ./... | grep -vE '(^|/)(gen)($|/)')
        staticcheck $pkgs
    go-modernize:
      run: |
        pkgs=$(go list ./... | grep -vE '(^|/)(gen)($|/)')
        modernize -errorsastype=false $pkgs
    go-mod:
      run: go mod tidy -diff
    go-mod-verify:
      run: go mod verify > /dev/null
    go-fmt:
      run: |
        unformatted=$(find . -type f -name '*.go' ! -path "./gen/*" -exec gofmt -l {} +)
        if [ -n "$unformatted" ]; then
          echo "The following files are not properly formatted:"
          echo "$unformatted"
          exit 1
        fi
    gitleaks:
      run: gitleaks dir -v --no-banner -l warn .
